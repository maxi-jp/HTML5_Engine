<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fighting Game - spark.js</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Press Start 2P', cursive;
        }
        
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            margin: 0;
            padding: 20px;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        #canvasContainer {
            position: relative;
            display: inline-block;
            background-color: #000;
            border: 4px solid white;
        }
        
        canvas {
            display: block;
            width: 1024px;
            height: 576px;
        }
        
        #hudContainer {
            position: absolute;
            display: flex;
            width: 100%;
            align-items: center;
            padding: 20px;
            top: 0;
            left: 0;
            z-index: 100;
        }
        
        .health-container {
            position: relative;
            width: 100%;
            display: flex;
            height: 30px;
            border: 4px solid white;
        }
        
        .health-background {
            background-color: red;
            height: 100%;
            width: 100%;
            position: absolute;
        }
        
        .health-bar {
            position: absolute;
            background: #818cf8;
            top: 0;
            bottom: 0;
            height: 100%;
            width: 100%;
        }
        
        #playerHealth {
            border-left: 4px solid white;
            border-top: 4px solid white;
            border-bottom: 4px solid white;
        }
        
        #enemyHealth {
            border-right: 4px solid white;
            border-top: 4px solid white;
            border-bottom: 4px solid white;
        }
        
        #timer {
            background-color: black;
            width: 100px;
            height: 50px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            border: 4px solid white;
            font-size: 24px;
        }
        
        #displayText {
            position: absolute;
            color: white;
            align-items: center;
            justify-content: center;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            display: none;
            background-color: rgba(0, 0, 0, 0.8);
            font-size: 32px;
            z-index: 200;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div id="canvasContainer">
        <div id="hudContainer">
            <!-- Player 1 Health -->
            <div id="playerHealth" class="health-container">
                <div class="health-background"></div>
                <div class="health-bar" style="width: 100%;"></div>
            </div>
            
            <!-- Timer -->
            <div id="timer">60</div>
            
            <!-- Player 2 Health -->
            <div id="enemyHealth" class="health-container">
                <div class="health-background"></div>
                <div class="health-bar" style="width: 100%;"></div>
            </div>
        </div>
        
        <!-- Game Over Display -->
        <div id="displayText">Tie</div>
        
        <canvas id="canvas"></canvas>
    </div>

    <!-- Engine Scripts (in required order) -->
    <script src="src/engine/utils_math.js"></script>
    <script src="src/engine/utils_classes.js"></script>
    <script src="src/engine/renderer.js"></script>
    <script src="src/engine/gameobjects.js"></script>
    <script src="src/engine/input.js"></script>
    <script src="src/engine/audioplayer.js"></script>
    <script src="src/engine/particlesystem.js"></script>
    <script src="src/engine/htmlmenu.js"></script>
    <script src="src/engine/virtualcontrols.js"></script>
    <script src="src/engine/game.js"></script>
    <script src="src/engine/main.js"></script>
    
    <!-- Game Scripts -->
    <script src="src/examples/fighting_game/fighting_game.js"></script>
    
    <script>
        window.onload = () => {
            Init(FightingGame, "canvas");
        };
    </script>
</body>
</html>
